services:
  - type: web
    name: movie-rec-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: MOVIELENS_DIR
        value: /app/data/movielens
      - key: USE_SMALL_MOVIELENS
        value: "true"
      - key: APP_NAME
        value: Movie Recommendation API
