services:
  db:
    image: postgres:16-alpine
    container_name: movie-rec-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: movies
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movies"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: movie-rec-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Movie Recommendation API
      DATABASE_URL: postgresql://postgres:postgres@db:5432/movies
      TMDB_API_KEY: ${TMDB_API_KEY}
      MOVIELENS_DIR: /data/movielens
    volumes:
      - ../ml-25m:/data/movielens:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
